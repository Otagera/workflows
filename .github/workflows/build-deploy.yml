name: Build & deploy to Coolify

# Reusable: build a Docker image, push it to GHCR, then ask Coolify to
# redeploy. Coolify owns the running container; CI only produces the image
# and pulls the trigger. The host never builds (its root disk is tight).
#
# Caller needs:
#   permissions: { contents: read, packages: write }
#   with:    webhook: ${{ vars.COOLIFY_WEBHOOK }}
#   secrets: inherit                      (passes COOLIFY_TOKEN, BUILD_ARGS)
#
# Tags pushed: :latest (what Coolify pulls) and :<sha> (the rollback handle).

on:
  workflow_call:
    inputs:
      image:
        description: GHCR image name, without owner. Defaults to the repo name.
        type: string
        default: ''
      context:
        description: Docker build context.
        type: string
        default: .
      file:
        description: Dockerfile path. Defaults to <context>/Dockerfile.
        type: string
        default: ''
      target:
        description: Multi-stage build target.
        type: string
        default: ''
      build-args:
        description: Non-secret build args, one KEY=VALUE per line.
        type: string
        default: ''
      platforms:
        description: Target platforms.
        type: string
        default: linux/amd64
      deploy:
        description: Trigger Coolify after pushing. Set false when one repo builds several images and deploys once at the end.
        type: boolean
        default: true
      webhook:
        description: Coolify deploy URL. Pass vars.COOLIFY_WEBHOOK.
        type: string
        default: ''
    secrets:
      COOLIFY_TOKEN:
        required: false
      BUILD_ARGS:
        description: Secret build args, one KEY=VALUE per line (e.g. a Sentry DSN baked into a frontend).
        required: false
    outputs:
      image:
        description: Full image reference without tag, e.g. ghcr.io/owner/name
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.names.outputs.image }}
    concurrency:
      # Serialise builds of the same image so an older build can never push
      # :latest after a newer one. Queued runs are replaced, never cancelled
      # mid-push.
      group: build-${{ github.repository }}-${{ inputs.image }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - id: names
        name: Image name
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          name="${IMAGE:-${GITHUB_REPOSITORY#*/}}"
          name="$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')"
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/$name" >> "$GITHUB_OUTPUT"

      - id: args
        name: Merge build args
        env:
          PUBLIC_ARGS: ${{ inputs.build-args }}
          SECRET_ARGS: ${{ secrets.BUILD_ARGS }}
        run: |
          delim="ARGS_$(openssl rand -hex 8)"
          {
            echo "value<<$delim"
            printf '%s\n%s\n' "$PUBLIC_ARGS" "$SECRET_ARGS" | sed '/^[[:space:]]*$/d'
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ steps.args.outputs.value }}
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:latest
            ${{ steps.names.outputs.image }}:${{ github.sha }}
          # Links the GHCR package to this repo, so it inherits the repo's
          # access settings instead of being an orphan package.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ steps.names.outputs.name }}
          cache-to: type=gha,scope=${{ steps.names.outputs.name }},mode=max

  deploy:
    needs: build
    if: inputs.deploy
    runs-on: ubuntu-latest
    concurrency:
      # Never interrupt a deploy half-way: Coolify would be left mid-restart.
      group: deploy-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: Otagera/workflows/deploy@main
        with:
          webhook: ${{ inputs.webhook || vars.COOLIFY_WEBHOOK }}
          token: ${{ secrets.COOLIFY_TOKEN }}
